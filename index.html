<!doctype html>
<html lang="en" class="scroll-smooth" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>USH - Community of Traders</title>
    <meta name="title" content="USH - Community of Traders" />
    <meta name="description" content="A thriving community of forex traders sharing institutional market analysis, trade setups, daily insights, and practical education." />

    <!-- Open Graph / WhatsApp / Telegram / Facebook Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ush-trading-community.vercel.app/" />
    <meta property="og:site_name" content="USH" />
    <meta property="og:title" content="USH - Community of Traders" />
    <meta property="og:description" content="A thriving community of forex traders sharing institutional market analysis, trade setups, daily insights, and practical education." />
    
    <!-- WhatsApp & Social Preview Image (High-Priority JPEG) -->
    <meta property="og:image" content="https://ush-trading-community.vercel.app/og-preview.jpg" />
    <meta property="og:image:secure_url" content="https://ush-trading-community.vercel.app/og-preview.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="USH Community of Traders Logo" />

    <!-- Secondary Fallback Image for WhatsApp Compact Preview -->
    <meta property="og:image" content="https://ush-trading-community.vercel.app/ush-thumb.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="315" />

    <!-- Twitter / X Card Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://ush-trading-community.vercel.app/" />
    <meta name="twitter:title" content="USH - Community of Traders" />
    <meta name="twitter:description" content="A thriving community of forex traders sharing institutional market analysis, trade setups, daily insights, and practical education." />
    <meta name="twitter:image" content="https://ush-trading-community.vercel.app/og-preview.jpg" />
    <meta name="twitter:image:alt" content="USH Community of Traders Logo" />

    <!-- Microdata & Fallbacks -->
    <meta itemprop="image" content="https://ush-trading-community.vercel.app/og-preview.jpg" />
    <meta name="thumbnail" content="https://ush-trading-community.vercel.app/og-preview.jpg" />
    <link rel="image_src" href="https://ush-trading-community.vercel.app/og-preview.jpg" />

    <!-- Icons -->
    <link rel="icon" type="image/jpeg" href="/ush-square.jpg" />
    <link rel="shortcut icon" href="/ush-square.jpg" />
    <link rel="apple-touch-icon" href="/ush-square.jpg" />
    <link rel="alternate icon" href="/favicon.svg" />

    <!-- Preconnect to TradingView CDN for accelerated chart loading -->
    <link rel="preconnect" href="https://s.tradingview.com" crossorigin />
    <link rel="dns-prefetch" href="https://s.tradingview.com" />
    <link rel="preconnect" href="https://s3.tradingview.com" crossorigin />
    <link rel="dns-prefetch" href="https://s3.tradingview.com" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#F7FAFF] text-[#181C20] antialiased selection:bg-[#116afe]/20 selection:text-[#0053cf]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
